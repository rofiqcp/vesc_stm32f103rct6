# =============================================================================
# VESC / Hoverboard STM32F103RCT6 - OpenOCD debug configuration
# OpenOCD : tested for 0.11.x syntax
# MCU     : STM32F103RCT6 / Cortex-M3
# Probe   : ST-LINK V2 (detected firmware V2J46S7, VID:PID 0483:3748), SWD
# RTOS    : FreeRTOS (CMSIS-RTOS2 wrapper in firmware)
#
# IMPORTANT FOR OPENOCD 0.11.x:
#   interface/stlink.cfg uses the old HLA backend.
#   HLA does not expose the Cortex-M specific commands used below.
#   Use stlink-dap.cfg + dapdirect_swd instead.
# =============================================================================

# ---- ST-LINK native ARM-DAP backend ------------------------------------------
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

# Target file resets adapter speed to 1000 kHz during sourcing; set desired
# debug speed again after sourcing target/stm32f1x.cfg.
source [find target/stm32f1x.cfg]

# Force the intended target as current before target-specific commands.
targets $_TARGETNAME

# Reliable SWD speed for real-time motor-control debugging.
# Raise to 1800/4000 only after the session is stable.
adapter speed 1000

# FreeRTOS thread awareness. This must be configured before init.
$_TARGETNAME configure -rtos FreeRTOS

# Standard OpenOCD server ports.
gdb_port 3333
telnet_port 4444
tcl_port 6666

# ---- Initialize and halt ------------------------------------------------------
init

# Cortex-M specific controls now work because dapdirect_swd creates a real
# cortex_m target instead of the old HLA target.
cortex_m maskisr auto

# Hardware vector catch. These do not consume the normal FPB breakpoint slots.
# Catch all fault classes but not reset, so normal reset sequences still work.
cortex_m vector_catch hard_err mm_err bus_err state_err chk_err nocp_err

reset halt

# =============================================================================
# Convenience monitor commands
# Call from GDB with: monitor <command>
# Or from telnet: telnet localhost 4444
# =============================================================================

proc vesc_reset_halt {} {
    reset halt
}

proc vesc_run {} {
    resume
}

proc vesc_halt {} {
    halt
}

proc vesc_core_state {} {
    halt
    echo "=== CORE REGISTERS ==="
    reg
    echo "=== SCB ICSR / VTOR / AIRCR / SHCSR ==="
    mdw 0xE000ED04 1
    mdw 0xE000ED08 1
    mdw 0xE000ED0C 1
    mdw 0xE000ED24 1
}

# CFSR, HFSR, DFSR, MMFAR, BFAR, AFSR
proc vesc_fault_state {} {
    halt
    echo "=== CORTEX-M FAULT REGISTERS ==="
    echo "CFSR  @ 0xE000ED28"
    mdw 0xE000ED28 1
    echo "HFSR  @ 0xE000ED2C"
    mdw 0xE000ED2C 1
    echo "DFSR  @ 0xE000ED30"
    mdw 0xE000ED30 1
    echo "MMFAR @ 0xE000ED34"
    mdw 0xE000ED34 1
    echo "BFAR  @ 0xE000ED38"
    mdw 0xE000ED38 1
    echo "AFSR  @ 0xE000ED3C"
    mdw 0xE000ED3C 1
}

# NVIC enabled, pending and active bitmaps + external IRQ priorities.
# STM32F103 connectivity/HD variants have fewer than 96 external IRQs, but
# reading three 32-bit bitmap words is harmless and makes the dump uniform.
proc vesc_nvic_state {} {
    halt
    echo "=== NVIC ISER: enabled IRQs ==="
    mdw 0xE000E100 3
    echo "=== NVIC ISPR: pending IRQs ==="
    mdw 0xE000E200 3
    echo "=== NVIC IABR: active IRQs ==="
    mdw 0xE000E300 3
    echo "=== NVIC IPR: external IRQ priorities ==="
    mdb 0xE000E400 68
}

# Main peripherals involved in ADC/FOC, motor PWM, Hall/encoder and USART3.
proc vesc_motor_periph_state {} {
    halt
    echo "=== RCC ==="
    mdw 0x40021000 12
    echo "=== DMA1 ==="
    mdw 0x40020000 16
    echo "=== DMA2 ==="
    mdw 0x40020400 16
    echo "=== ADC1 ==="
    mdw 0x40012400 16
    echo "=== ADC2 ==="
    mdw 0x40012800 16
    echo "=== ADC3 ==="
    mdw 0x40013C00 16
    echo "=== TIM1 ==="
    mdw 0x40012C00 20
    echo "=== TIM8 ==="
    mdw 0x40013400 20
    echo "=== TIM4 / encoder ==="
    mdw 0x40000800 16
    echo "=== USART3 ==="
    mdw 0x40004800 8
    echo "=== EXTI ==="
    mdw 0x40010400 6
}

# Stochastic PC profiling; considerably less intrusive than breaking on the
# ~16 kHz ADC/FOC ISR. OpenOCD writes gmon-compatible output.
proc vesc_profile_5s {} {
    echo "Profiling PC for 5 seconds -> vesc_profile.gmon"
    profile 5 vesc_profile.gmon
}

proc vesc_profile_10s {} {
    echo "Profiling PC for 10 seconds -> vesc_profile.gmon"
    profile 10 vesc_profile.gmon
}

proc vesc_where {} {
    echo "=== TARGET ==="
    targets
    poll
    debug_reason
}

proc vesc_vector_catch_on {} {
    cortex_m vector_catch hard_err mm_err bus_err state_err chk_err nocp_err
}

proc vesc_vector_catch_off {} {
    cortex_m vector_catch none
}

proc vesc_maskisr_auto {} {
    cortex_m maskisr auto
}

proc vesc_maskisr_off {} {
    cortex_m maskisr off
}

echo ""
echo "============================================================"
echo " VESC STM32F103RCT6 OpenOCD DEBUG READY"
echo "============================================================"
echo "Backend : ST-LINK DAP-direct / SWD"
echo "Target  : Cortex-M3, reset + halted"
echo "RTOS    : FreeRTOS awareness enabled"
echo "GDB     : localhost:3333"
echo "Telnet  : localhost:4444"
echo "TCL     : localhost:6666"
echo "Fault vector catch: enabled"
echo ""
echo "Useful monitor commands:"
echo "  vesc_reset_halt"
echo "  vesc_run"
echo "  vesc_halt"
echo "  vesc_where"
echo "  vesc_core_state"
echo "  vesc_fault_state"
echo "  vesc_nvic_state"
echo "  vesc_motor_periph_state"
echo "  vesc_profile_5s"
echo "  vesc_profile_10s"
echo "  vesc_vector_catch_on / vesc_vector_catch_off"
echo "============================================================"
echo ""
