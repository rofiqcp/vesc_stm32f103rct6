# VESC STM32F103RCT6 - ST-LINK DAP-direct + SWD + FreeRTOS awareness
# Primary config for OpenOCD 0.11+.
adapter driver st-link
transport select dapdirect_swd
adapter speed 950

set CHIPNAME stm32f103rc
source [find target/stm32f1x.cfg]

# Let GDB/OpenOCD expose FreeRTOS tasks as threads after vTaskStartScheduler().
$_TARGETNAME configure -rtos FreeRTOS

# Keep the default STM32F1 reset strategy. SWD-only debugging does not require
# a UART or USB connection to the MCU.
gdb_port 3333
telnet_port 4444
tcl_port 6666

# -----------------------------------------------------------------------------
# Hardware snapshots. Run from GDB with: monitor <command>
# These read hardware registers only; GDB symbols are handled by vesc.gdb.
# -----------------------------------------------------------------------------
proc vesc_uart_hw {} {
    echo "=== USART3 @ 0x40004800 ==="
    echo "SR DR BRR CR1 CR2 CR3 GTPR"
    mdw 0x40004800 7
    echo "=== DMA1 global ==="
    echo "ISR IFCR"
    mdw 0x40020000 2
    echo "=== DMA1 Channel2 USART3_TX ==="
    echo "CCR CNDTR CPAR CMAR"
    mdw 0x4002001c 4
    echo "=== DMA1 Channel3 USART3_RX ==="
    echo "CCR CNDTR CPAR CMAR"
    mdw 0x40020030 4
}

proc vesc_clock_hw {} {
    echo "=== RCC CR..APB1ENR ==="
    mdw 0x40021000 8
    echo "=== AFIO MAPR ==="
    mdw 0x40010004 1
    echo "=== GPIOB CRL CRH IDR ODR ==="
    mdw 0x40010c00 4
}

proc vesc_nvic_hw {} {
    echo "=== NVIC ISER0/ISER1 ==="
    mdw 0xe000e100 2
    echo "=== NVIC IPR bytes around DMA1_Ch1..Ch3 (IRQ11-13) ==="
    mdb 0xe000e40b 3
    echo "=== NVIC IPR USART3 (IRQ39) ==="
    mdb 0xe000e427 1
}

proc vesc_fault_hw {} {
    echo "=== Cortex-M3 fault state ==="
    echo "SHCSR CFSR HFSR DFSR MMFAR BFAR AFSR"
    mdw 0xe000ed24 7
}

proc vesc_motor_hw {} {
    echo "=== DMA1 Channel1 ADC current-loop ==="
    mdw 0x40020008 4
    echo "=== ADC1 ==="
    mdw 0x40012400 16
    echo "=== ADC2 ==="
    mdw 0x40012800 16
    echo "=== TIM1 ==="
    mdw 0x40012c00 20
    echo "=== TIM8 ==="
    mdw 0x40013400 20
}

proc vesc_all_hw {} {
    vesc_clock_hw
    vesc_uart_hw
    vesc_nvic_hw
    vesc_fault_hw
    vesc_motor_hw
}
