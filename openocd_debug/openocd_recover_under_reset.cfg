# EMERGENCY ONLY: use once to replace an older image that disabled SWD or
# entered a very fast reset loop. NRST from ST-LINK must be wired to MCU NRST.
if {[catch {source [find interface/stlink-hla.cfg]}]} {
    source [find interface/stlink.cfg]
}
transport select hla_swd
adapter speed 200
reset_config srst_only srst_nogate connect_assert_srst

set CHIPNAME stm32f103rc
source [find target/stm32f1x.cfg]
