# OpenOCD flash script for STM32F103RCT6 via ST-LINK/V2
source [find interface/stlink.cfg]
source [find target/stm32f1x.cfg]

# ST-LINK/V2 on this board enumerates at 0483:3748
transport select hla_swd

# Increased adapter speed for flash programming
adapter speed 4000

init
reset init

# Use the freshly built firmware
program {.pio/build/stm32f103rc/firmware.elf} verify reset exit
