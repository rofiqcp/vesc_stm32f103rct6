[env:stm32f103rc]
platform = ststm32
board = genericSTM32F103RC
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
# Reserve final 2 KiB flash page (0x0803F800..0x0803FFFF) for persistent config.
board_upload.maximum_size = 260096
extra_scripts = pre:extra_script.py
build_flags =
    -DSTM32F103xE
    -DUSE_HAL_DRIVER
    -Isrc
    -O3
    -ffast-math
    -fno-math-errno
    -Wall
    -Wextra
    -Wshadow
    -Wdouble-promotion
    -Wformat=2
    -Werror=return-type
    -Werror=implicit-function-declaration
    -Wno-unused-parameter
    -Wno-pedantic
build_unflags = -Os
monitor_speed = 115200
