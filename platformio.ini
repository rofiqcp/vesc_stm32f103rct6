; =============================================================================
; VESC / Hoverboard STM32F103RCT6 - PlatformIO configuration
; MCU      : STM32F103RCT6
; Framework: STM32CubeF1
; Probe    : ST-LINK / SWD
;
; Environments:
;   stm32f103rc       = release build, unchanged from the working project
;   stm32f103rc_debug = source-level GDB debug build (-Og + DWARF)
; =============================================================================

[platformio]
default_envs = stm32f103rc

; =============================================================================
; RELEASE - keep the existing working firmware behaviour
; =============================================================================
[env:stm32f103rc]
platform = ststm32
board = genericSTM32F103RC
framework = stm32cube
board_build.ldscript = src/stm32f103rc_flash.ld
upload_protocol = stlink
debug_tool = stlink

; Reserve final 8 KiB (four 2-KiB pages) 0x0803E000..0x0803FFFF
; for persistent configuration.
board_upload.maximum_size = 253952

; STM32F103RCT6 SRAM = 48 KiB.
board_upload.maximum_ram_size = 49152

; Adds FreeRTOS kernel + CMSIS-RTOS2 sources used by this firmware.
extra_scripts = pre:tools/extra_script.py

build_flags =
    -DSTM32F103xE
    -DUSE_HAL_DRIVER
    -Isrc
    -Isrc/applications
    -Isrc/comm
    -Isrc/encoder
    -Isrc/motor
    -Isrc/hwconf
    -Isrc/util
    -O3
    -fno-math-errno

build_src_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wdouble-promotion
    -Wformat=2
    -Werror=return-type
    -Werror=implicit-function-declaration

build_unflags =
    -Os

monitor_speed = 115200


; =============================================================================
; DEBUG - same hardware/linker/FreeRTOS configuration, but with DWARF symbols
; =============================================================================
[env:stm32f103rc_debug]
platform = ststm32
board = genericSTM32F103RC
framework = stm32cube
board_build.ldscript = src/stm32f103rc_flash.ld
upload_protocol = stlink
debug_tool = stlink

build_type = debug

; Same flash/RAM limits as release build.
board_upload.maximum_size = 253952
board_upload.maximum_ram_size = 49152

; Keep exactly the same FreeRTOS/CMSIS-RTOS2 integration.
extra_scripts = pre:tools/extra_script.py

build_flags =
    -DSTM32F103xE
    -DUSE_HAL_DRIVER
    -Isrc
    -Isrc/applications
    -Isrc/comm
    -Isrc/encoder
    -Isrc/motor
    -Isrc/hwconf
    -Isrc/util
    -fno-math-errno

build_src_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wdouble-promotion
    -Wformat=2
    -Werror=return-type
    -Werror=implicit-function-declaration

; Remove release/framework optimization flags.
build_unflags =
    -Os
    -O1
    -O2
    -O3
    -Ofast

; Source-level debug.
debug_build_flags =
    -Og
    -g3
    -ggdb3
    -fno-omit-frame-pointer

monitor_speed = 115200