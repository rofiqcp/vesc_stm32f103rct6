[platformio]
default_envs = stm32f103rc

[env:stm32f103rc]
platform = ststm32
board = genericSTM32F103RC
framework = stm32cube
board_build.ldscript = src/stm32f103rc_flash.ld
upload_protocol = stlink
debug_tool = stlink
# Reserve final 8 KiB (four 2-KiB pages) (0x0803E000..0x0803FFFF) for persistent config.
board_upload.maximum_size = 253952
# Lock linker/checkprogsize to the real STM32F103RCT6 SRAM capacity.
board_upload.maximum_ram_size = 49152
extra_scripts = pre:tools/vesc.py
build_flags =
    -DSTM32F103xE
    -DUSE_HAL_DRIVER
    -DVESC_IWDG_ENABLE=0
    -DVESC_REALTIME_OPTIMIZED=1
    -Isrc
    -Isrc/applications
    -Isrc/comm
    -Isrc/encoder
    -Isrc/motor
    -Isrc/hwconf
    -Isrc/util
    -O3
    -fno-math-errno

# IMPORTANT: warning policy is source-scoped. PlatformIO build_flags are global
# and would otherwise apply -Werror to STM32CubeF1 vendor sources as well.
# Keep vendor/framework build clean from project warning policy, while still
# checking our firmware sources aggressively.
build_src_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wdouble-promotion
    -Wformat=2
    -Werror=return-type
    -Werror=implicit-function-declaration
build_unflags = -Os
monitor_speed = 115200

[env:stm32f103rc_debug]
extends = env:stm32f103rc
# Debug symbols are kept, but the motor-control image MUST stay optimized.
# Cortex-M3 has no FPU and this firmware executes two FOC current loops in the
# same 16-kHz DMA IRQ. The old -Og image could exceed the 4000-cycle deadline
# only after PWM became active, which surfaced in VESC Tool as FAULT_CODE_DRV.
build_type = debug
build_unflags =
    -Os
    -O0
    -O1
    -O2
    -Og
build_flags =
    ${env:stm32f103rc.build_flags}
    -O3
    -g3
    -ggdb3
    -DVESC_DEBUG_BUILD=1
    -DVESC_REALTIME_OPTIMIZED=1
    -Wl,--undefined=uxTopUsedPriority
build_src_flags =
    ${env:stm32f103rc.build_src_flags}
    -O3
    -g3
    -ggdb3
